<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车辆操作 · DOM 状态回归</title><style>body{margin:0;background:#f5f0e6;color:#142b38;font:14px/1.5 system-ui}header{padding:16px;border-bottom:1px solid #807e74}h1{font-size:18px;margin:0}p{margin:6px 0}nav{display:flex;gap:6px;flex-wrap:wrap}button,select{background:#142b38;color:#f5f0e6;border:1px solid #78909a;padding:10px;font:inherit;min-height:44px;border-radius:3px}main{padding:12px;overflow:auto}iframe{display:block;border:1px solid #807e74;width:390px;height:844px;margin:auto}pre{white-space:pre-wrap;padding:16px;font-size:12px}#result{color:#a43c28}</style><header><h1>车辆操作 · 真实 DOM / CSS 状态测试</h1><p>仅界面状态，不运行 WebGL、真实驾驶或飞行动力学；不读写真实存档。操作、固定、车辆入口使用生产事件。</p><nav><select id="size"><option>390×844</option><option>844×390</option><option>667×375</option><option>568×320</option><option>320×568</option><option>768×1024</option><option>1280×720</option></select><button data-action="tools">操作面板</button><button data-action="pin">切换固定</button><button data-action="vehicle">车辆操作入口</button><button data-action="open">展开车辆</button><button data-action="close">收起车辆</button><button data-action="road">地面 / 已着陆</button><button data-action="pending">起飞准备</button><button data-action="air">空中</button><button data-action="landing">缓降</button><button data-action="recover">回正</button><button data-action="unpowered">失去动力</button><button data-action="long-warning">长警告</button><button data-action="attitude">姿态控制</button><button data-action="aircraft">飞机界面</button><button id="aircraft-matrix">运行飞机界面检查</button><button id="matrix">运行视口 / 状态矩阵</button></nav><p id="result" role="status">正在载入…</p></header><main><iframe id="frame" title="车辆界面真实 DOM"></iframe></main><pre id="samples"></pre><script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),samples=document.querySelector('#samples');let pending=null,airPending=null;
function size(value){const[w,h]=value.split('×');frame.style.width=w+'px';frame.style.height=h+'px'}
document.querySelector('#size').onchange=e=>size(e.target.value);
const send=action=>frame.contentWindow.postMessage({type:'panel-action',action},location.origin);
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>send(b.dataset.action));
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data?.type==='panel-ready')result.textContent='界面就绪，可测试真实生产按钮及地面 / 飞行 / 着陆状态';if(e.data?.type==='preview-error')result.textContent=e.data.message;if(e.data?.type==='aircraft-sample'){samples.textContent=JSON.stringify(e.data.sample,null,2);if(airPending){const done=airPending;airPending=null;done(e.data.sample)}}if(e.data?.type==='panel-sample'){samples.textContent=JSON.stringify(e.data.sample,null,2);if(pending){const done=pending;pending=null;done(e.data.sample)}}});
document.querySelector('#aircraft-matrix').onclick=async()=>{const rows=[];for(const viewport of ['568×320','667×375','844×390','390×844']){size(viewport);rows.push(await new Promise(resolve=>{airPending=resolve;frame.contentWindow.postMessage({type:'aircraft-check'},location.origin)}))}const passed=rows.every(r=>!r.overlaps.length&&r.groundHUDHidden&&r.buttons44&&r.withinViewport);result.textContent=passed?'PASS · 飞机界面无碰撞，飞控按钮 ≥44px':'FAIL · 飞机检查见下方';samples.textContent=JSON.stringify({passed,rows},null,2)};
const act=action=>new Promise(resolve=>{pending=resolve;send(action)});
document.querySelector('#matrix').onclick=async()=>{const rows=[];result.textContent='正在运行真实浏览器布局矩阵…';for(const viewport of ['390×844','844×390','667×375','568×320','320×568','768×1024','1280×720']){size(viewport);await act('road');await act('open');for(const state of ['road','pending','air','landing','recover','unpowered','road','long-warning'])rows.push({viewport,...await act(state)});await act('close');await act('open');rows.push({viewport,...await act('road')})}const failed=rows.filter(r=>!r.open||r.width<=0||r.height<=0||r.horizontalOverflow||!r.buttonsFit||!r.withinViewport||r.padOverlap||r.background!=='rgb(20, 43, 56)');const stable=[...new Set(rows.map(r=>r.viewport))].every(v=>new Set(rows.filter(r=>r.viewport===v).map(r=>r.width)).size===1);result.textContent=failed.length||!stable?'FAIL · 请检查下方结果':'PASS · 63 个浏览器视口/状态检查，宽度稳定、无横向溢出、按钮 ≥44px、海岸配色一致';samples.textContent=JSON.stringify({passed:!failed.length&&stable,stableWidth:stable,failed,rows},null,2)};
const html=await fetch('./runtime/index.html').then(r=>r.text());const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script').forEach(s=>s.remove());const base=doc.createElement('base');base.href=new URL('./runtime/',location.href);doc.head.prepend(base);const style=doc.createElement('style');style.textContent='#loading{display:none!important}#world{background:#304b57}.vignette{display:none}';doc.head.append(style);const script=doc.createElement('script');script.type='module';script.src=new URL('./fixture.js',location.href);doc.body.append(script);frame.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
</script></html>
