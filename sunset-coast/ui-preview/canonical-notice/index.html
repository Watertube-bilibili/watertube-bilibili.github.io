<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入口官网提示 · DOM 检查</title><style>body{margin:20px;background:#e7dfd0;color:#142b38;font:14px/1.6 system-ui}button{min-height:44px;margin:4px;padding:8px 16px;border:1px solid #142b38;background:#f5f0e6;color:#142b38;font:inherit}iframe{display:block;background:white;border:1px solid #142b38;max-width:none}#viewport{overflow:auto;max-width:100%}pre{white-space:pre-wrap}button:focus-visible{outline:3px solid #a43c28}</style><h1>入口官网提示 · DOM 检查</h1><p>真实入口页面，标准版使用存档管理模式防止自动跳转。仅用于布局检查。</p><nav aria-label="检查尺寸"><button data-width="320">320 × 700</button><button data-width="390">390 × 844</button><button data-width="844">844 × 390</button></nav><nav aria-label="检查页面"><button data-page="standard">标准版入口</button><button data-page="beta">2.0 入口</button><button id="matrix">运行六项检查</button></nav><p id="state" role="status"></p><div id="viewport"><iframe id="preview" title="真实入口页面" width="320" height="700" src="/neon-coast/?manage=1"></iframe></div><pre id="results" role="status"></pre><script>
const frame=document.querySelector('#preview'),state=document.querySelector('#state'),result=document.querySelector('#results');const paths={standard:'/neon-coast/?manage=1',beta:'/neon-coast/beta/'};let page='standard',width=320;const heights={320:700,390:844,844:390};
function label(){state.textContent=`${page==='standard'?'标准版':'2.0'} · ${width} × ${heights[width]}`;}
function resize(w){width=w;frame.width=w;frame.height=heights[w];label();}
function navigate(p){page=p;frame.src=paths[p];label();}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>resize(+b.dataset.width));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));label();
async function loaded(p){if(page===p&&frame.contentDocument?.readyState==='complete')return;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('页面加载超时')),15000);frame.onload=()=>{clearTimeout(timer);resolve()};navigate(p)});}
const pause=()=>new Promise(r=>setTimeout(r,150));
document.querySelector('#matrix').onclick=async()=>{const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);result.textContent='检查中…';const rows=[];try{for(const p of ['standard','beta']){await loaded(p);for(const w of [320,390,844]){resize(w);await pause();const d=frame.contentDocument,n=d.querySelector('.canonical-notice'),a=n?.querySelector('a'),copy=n?.querySelector('.canonical-notice-copy');const r=n?.getBoundingClientRect(),ar=a?.getBoundingClientRect();const checks={notice:!!n,exactText:copy?.textContent===`近期发现零起虚假的${p==='beta'?'sunset coast':'霓虹海岸'}网站，请认准本站：https://watertube-bilibili.github.io/sunset-coast/`,canonical:a?.href==='https://watertube-bilibili.github.io/sunset-coast/',noticeWithinViewport:!!r&&r.left>=0&&r.right<=w+1,linkWithinNotice:!!ar&&ar.left>=r.left&&ar.right<=r.right+1,linkTarget44:!!ar&&ar.height>=44,noHorizontalOverflow:d.documentElement.scrollWidth<=w+1};rows.push({page:p,width:w,pass:Object.values(checks).every(Boolean),checks,notice:r?{x:r.x,y:r.y,width:r.width,height:r.height}:null});result.textContent=JSON.stringify(rows,null,2);}}}catch(e){result.textContent+='\nERROR: '+e.message}finally{buttons.forEach(b=>b.disabled=false)}};
</script></html>
