<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON COAST · 展厅界面预览</title><style>*{box-sizing:border-box}body{margin:0;background:#e7dfd0;color:#142b38;font:14px/1.6 system-ui}header{padding:16px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:#f5f0e6;border-bottom:1px solid #bcb7aa}h1{font-size:17px;margin:0}p{font-size:12px;color:#52616a;margin:2px 0}nav{margin-left:auto;display:flex;gap:8px}button,select{min-height:44px;padding:8px 12px;font:inherit;background:#f5f0e6;color:#142b38;border:1px solid #bcb7aa;border-radius:3px;cursor:pointer}:focus-visible{outline:2px solid #a43c28;outline-offset:3px}main{padding:18px;overflow:auto}iframe{display:block;width:100%;height:850px;border:1px solid #bcb7aa;background:#142b38;margin:auto}footer{padding:0 24px 18px;font-size:12px;color:#52616a}@media(max-width:600px){header{padding:12px}main{padding:8px}nav{margin:0}}</style></head><body>
<header><div><h1>汽车设计展厅 / UI-only 交互预览</h1><p>实际展厅 HTML / CSS 与车型目录。舞台为文字占位，无汽车插画、3D 模型或 WebGL。</p></div><nav><select id="viewport" aria-label="预览尺寸"><option value="desktop">桌面 · 自适应</option><option value="390">手机 · 390 × 844</option><option value="768">平板 · 768 × 1024</option><option value="844">横屏 · 844 × 390</option></select></nav></header>
<main><iframe id="preview" title="真实展厅界面与车型目录预览"></iframe></main><footer id="review-status" role="status">正在载入展厅模板和车型目录…</footer>
<script type="module">
const frame=document.querySelector('#preview'),status=document.querySelector('#review-status');
const sourceURL=new URL('./runtime/showroom.html',location.href);
try{
 const [response,{MODELS}]=await Promise.all([fetch(sourceURL),import('./runtime/world.js')]);if(!response.ok)throw Error('展厅模板无法载入：'+response.status);
 const template=new DOMParser().parseFromString(await response.text(),'text/html');template.querySelectorAll('script').forEach(node=>node.remove());
 const base=template.createElement('base');base.href=new URL('./',sourceURL);template.head.prepend(base);
 template.querySelector('#studio').setAttribute('aria-label','UI-only 模型占位区域，不渲染三维汽车');
 template.querySelector('.interaction-hint').textContent='UI-only 控件演示 · 不执行旋转、缩放或模型动画';
 const style=template.createElement('style');style.textContent='#studio{background:#142b38}.loading-dot{animation:none!important;background:#f08a68}.loading-state{box-shadow:none;border:1px solid #46616c;max-width:300px;text-align:center;pointer-events:none}.loading-state span:last-of-type{white-space:pre-line}';template.head.append(style);
 frame.onload=()=>{
  const doc=frame.contentDocument,$=id=>doc.getElementById(id),brandOf=m=>String(m.brand||m.name?.trim().split(/\s+/)[0]||'其他').toUpperCase();
  const brands=[...new Set(MODELS.map(brandOf))];let current=MODELS[0],view='orbit',doors=false,spin=true;
  const say=text=>{status.textContent=text};
  const updateState=()=>{$('loading-text').textContent='UI-only model placeholder\n仅界面占位 · 未加载三维模型';$('model-caption').textContent='示例控件状态 · '+({orbit:'全貌',front:'车头',rear:'车尾',interior:'座舱'}[view])+' / '+(doors?'车门打开':'车门关闭')+' / '+(spin?'旋转已选中':'旋转未选中');$('door-toggle').textContent=doors?'关闭车门':'打开车门';$('door-toggle').setAttribute('aria-pressed',String(doors));$('spin-toggle').setAttribute('aria-pressed',String(spin));for(const b of doc.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===view))};
  const select=id=>{current=MODELS.find(m=>m.id===id)||MODELS[0];$('model-name').textContent=current.name;$('model-brand').textContent=brandOf(current);$('model-description').textContent=current.desc;$('model-speed').textContent=Math.round(current.max*3.6);$('model-range').textContent=current.range;$('model-trim').textContent=current.trim;$('asset-credit').hidden=current.id!=='vision';view='orbit';doors=false;updateState();say('已选择 '+current.name+'。参数来自实际游戏目录；舞台仅为文字占位，未加载模型。')};
  const option=(label,value)=>{const o=doc.createElement('option');o.textContent=label;o.value=value;return o};
  const populate=brand=>{$('model-select').replaceChildren();for(const m of MODELS.filter(m=>!brand||brandOf(m)===brand))$('model-select').append(option(m.name,m.id));select($('model-select').value)};
  $('brand-select').append(option('全部品牌',''));for(const b of brands)$('brand-select').append(option(b,b));$('catalog-count').textContent=brands.length+' 个品牌 · '+MODELS.length+' 款车型';
  $('brand-select').onchange=e=>populate(e.target.value);$('model-select').onchange=e=>select(e.target.value);
  $('interior-view').hidden=false;$('door-toggle').disabled=false;
  for(const b of doc.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;updateState();say('已选择“'+b.textContent+'”控件状态。仅演示界面，不改变三维视角，也不代表当前车型支持情况。')};
  $('door-toggle').onclick=()=>{doors=!doors;updateState();say('车门控件：'+(doors?'打开':'关闭')+'。只切换 UI 状态，没有模型动画。')};
  $('spin-toggle').onclick=()=>{spin=!spin;updateState();say('自动旋转控件：'+(spin?'开启':'关闭')+'。只切换 UI 状态，舞台不旋转。')};
  $('steering-input').oninput=e=>{$('steering-value').textContent=Math.round(Number(e.target.value)*180/Math.PI)+'°';say('转向控件数值：'+$('steering-value').textContent+'。未运行车轮、方向盘或物理模拟。')};
  $('studio').addEventListener('pointerdown',()=>say('模型区域为文字占位。UI-only 预览不执行拖动旋转或缩放。'));
  doc.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();say(a.id==='asset-credit'?'已选择来源署名入口；此预览保持当前页面。':'已选择返回游戏入口；此预览不启动游戏。')}));
  $('loading-state').hidden=false;$('retry-load').hidden=true;populate('');
 };
 frame.srcdoc='<!doctype html>'+template.documentElement.outerHTML;
}catch(e){status.textContent='预览未载入：'+e.message}
document.querySelector('#viewport').onchange=e=>{const v=e.target.value;frame.style.width=v==='desktop'?'100%':v+'px';frame.style.height=v==='390'?'844px':v==='768'?'1024px':v==='844'?'390px':'850px'};
</script></body></html>
