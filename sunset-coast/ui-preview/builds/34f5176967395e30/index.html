<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON COAST · 完整交互界面预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#142b38;font:14px/1.5 system-ui}header{padding:20px 26px;border-bottom:1px solid #c7beaf;display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:18px;margin:0;letter-spacing:-.02em}p{margin:5px 0;color:#55636a;font-size:12px}nav>a{color:#a43c28;text-decoration:underline;text-underline-offset:4px;align-self:center;font-size:12px;padding:8px}nav{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}button,select{font:inherit;background:#e7dfd0;border:1px solid #807e74;color:#142b38;padding:8px 12px;border-radius:3px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#a43c28;color:#fffaf2}button:focus-visible,select:focus-visible{outline:2px solid #a43c28;outline-offset:3px}main{padding:18px;display:grid;place-items:start center;overflow:auto}iframe{display:block;width:100%;height:calc(100dvh - 185px);min-height:500px;border:1px solid #807e74;border-radius:3px;background:#142b38;transition:width .25s}footer{padding:0 24px 16px;color:#55636a;font-size:11px}.state{color:#a43c28} @media(max-width:650px){header{padding:12px;gap:10px}nav{margin:0}main{padding:8px}iframe{height:780px}h1{font-size:15px}}</style></head><body>
<header><div><h1>NEON COAST / 海岸设计预览</h1><p>生产 DOM + 真实 UI 逻辑 · 示意场景与演示数据 · 不运行 WebGL、驾驶或物理</p></div><nav aria-label="预览控制"><select id="size" aria-label="视口尺寸"><option value="desktop">桌面 · 自适应</option><option value="390">手机 · 390 × 844</option><option value="768">平板 · 768 × 1024</option><option value="844">横屏 · 844 × 390</option></select><button data-view="hud">HUD</button><button data-view="home">手机</button><button data-view="garage">展厅</button><button data-view="map">地图</button><button data-view="settings">设置</button><button data-view="assist">ADAS</button><button data-view="characters">角色</button><button data-view="release">版本</button><button id="walk">切换步行</button><a href="./entry-fixture.html" target="_blank" rel="noopener">出发入口 ↗</a><a href="./showroom-fixture.html" target="_blank" rel="noopener">独立展厅 ↗</a></nav></header>
<main><iframe id="preview" title="真实生产界面交互预览"></iframe></main><footer><span id="status" class="state" role="status">正在载入生产界面…</span> · 所有变更仅在本页内存中演示，不读取或写入游戏存档。车辆与角色卡片使用明确标注的文字占位。可用上方导航或界面内原有入口浏览全部手机应用。</footer>
<script type="module">
const frame=document.querySelector('iframe');
const source=await fetch('./runtime/index.html').then(r=>{if(!r.ok)throw Error('生产 HTML 加载失败');return r.text()});
const doc=new DOMParser().parseFromString(source,'text/html');
for(const s of doc.querySelectorAll('script'))s.remove();
const base=doc.createElement('base');base.href=new URL('./runtime/',location.href);doc.head.prepend(base);
if(!doc.querySelector('[href*="interface-system.css"]')){const link=doc.createElement('link');link.rel='stylesheet';link.href='./interface-system.css';doc.head.append(link);}
const style=doc.createElement('style');style.textContent=`#loading{display:none!important}#world{background:linear-gradient(180deg,#122d42 0%,#415d65 43%,#203b45 44%,#10212c 100%)}#preview-scene{position:fixed;inset:0;pointer-events:none;overflow:hidden}#preview-scene:after{content:'UI PREVIEW / 示意场景';position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);color:#c5e4eb60;font:600 13px system-ui;letter-spacing:4px;white-space:nowrap}.preview-notice{position:fixed;left:50%;top:5px;transform:translateX(-50%);z-index:200;color:#a43c28;background:#142b38;color:#f5f0e6;border:1px solid #78909a;border-radius:5px;padding:3px 9px;font:10px system-ui;pointer-events:none;white-space:nowrap}`;doc.head.append(style);
const scene=doc.createElement('div');scene.id='preview-scene';doc.querySelector('#world').after(scene);
const badge=doc.createElement('div');badge.className='preview-notice';badge.textContent='界面演示 · 无真实驾驶 · 数据仅存内存';doc.body.append(badge);
const script=doc.createElement('script');script.type='module';script.src=new URL('./fixture.js',location.href);doc.body.append(script);
frame.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data?.type==='preview-ready')document.querySelector('#status').textContent='交互就绪 · 11 个手机入口与全部主要面板';if(e.data?.type==='preview-error')document.querySelector('#status').textContent='预览错误：'+e.data.message;});
const send=view=>frame.contentWindow.postMessage({type:'preview-view',view},location.origin);
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>send(b.dataset.view));
document.querySelector('#walk').onclick=()=>send('walk');
document.querySelector('#size').onchange=e=>{const v=e.target.value;frame.style.width=v==='desktop'?'100%':v+'px';frame.style.height=v==='desktop'?'calc(100dvh - 185px)':v==='390'?'844px':v==='768'?'1024px':'390px';frame.style.minHeight=v==='844'?'390px':'500px';frame.contentWindow.postMessage({type:'preview-mode',mode:v==='desktop'?'keyboard':'touch'},location.origin);};
</script></body></html>
