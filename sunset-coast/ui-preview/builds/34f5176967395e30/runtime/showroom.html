<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e6">
  <title>汽车设计展厅 · NEON COAST</title>
  <link rel="stylesheet" href="./showroom.css?v=47d43489f5aa">
</head>
<body>
  <canvas id="studio" aria-label="可拖动旋转的三维汽车展品" tabindex="0"></canvas>
  <header class="studio-header"><a href="./index.html" class="wordmark">NEON<span>COAST</span><small>汽车设计展厅</small></a><a class="back-link" href="./index.html">返回游戏 <span aria-hidden="true">↗</span></a></header>
  <section class="catalog" aria-label="车型选择">
    <div class="catalog-label"><h2>车型目录</h2><span id="catalog-count"></span></div>
    <div class="selectors"><label>品牌<select id="brand-select" aria-label="选择汽车品牌"></select></label><label>车型<select id="model-select" aria-label="选择车型"></select></label></div>
    <div class="model-copy"><h1 id="model-name">汽车设计展厅</h1><p id="model-brand"></p><p id="model-description"></p><a id="asset-credit" href="./ASSET_CREDITS.txt" target="_blank" rel="noopener" hidden>模型：Eric Chadwick / DGG · CC BY 4.0，已改编 ↗</a></div>
    <dl class="model-stats"><div><dt>最高时速</dt><dd><b id="model-speed">—</b><span>km/h</span></dd></div><div><dt>续航里程</dt><dd><b id="model-range">—</b><span>km</span></dd></div><div><dt>车款</dt><dd class="trim" id="model-trim">—</dd></div></dl>
  </section>
  <div class="loading-state" id="loading-state" role="status"><span class="loading-dot"></span><span id="loading-text">正在布置展厅…</span><button id="retry-load" hidden>重新加载</button></div>
  <footer class="studio-footer">
    <div class="view-controls" role="group" aria-label="查看角度"><button data-view="orbit" aria-pressed="true">全貌</button><button data-view="front" aria-pressed="false">车头</button><button data-view="rear" aria-pressed="false">车尾</button><button data-view="interior" aria-pressed="false" id="interior-view" hidden>座舱</button></div>
    <div class="detail-controls"><button id="door-toggle" aria-pressed="false">打开车门</button><button id="spin-toggle" aria-pressed="true">自动旋转 <span class="switch" aria-hidden="true"></span></button></div>
    <label class="steering-control">转向演示<input id="steering-input" type="range" min="-0.5" max="0.5" step="0.01" value="0" aria-label="预览车轮与方向盘转向"><output id="steering-value">0°</output></label>
    <p class="interaction-hint">拖动旋转 · 滚轮或双指缩放 <span>方向键旋转 · ＋ / − 缩放</span></p>
  </footer>
  <p class="studio-caption" id="model-caption">探索车身细节与座舱设计</p>
  
</body>
</html>
