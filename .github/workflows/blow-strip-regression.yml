name: Blow strip science and browser regression
on:
  push:
    branches: [codex/phy-blow-strip-continuous-20261115]
    paths:
      - sources/junior-physics-lab/**
      - .github/workflows/blow-strip-regression.yml
  pull_request:
    paths:
      - sources/junior-physics-lab/**
      - .github/workflows/blow-strip-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sources/junior-physics-lab
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Godot and browser test dependencies
        run: |
          curl --fail --location --retry 2 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          ln -s Godot_v4.6.3-stable_linux.x86_64 /tmp/godot/godot
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("CHROMIUM_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
          mkdir -p /tmp/blow-strip-ci
      - name: Scientific and existing model regressions
        run: |
          set -o pipefail
          node tests/catalog-audit.js | tee /tmp/blow-strip-ci/catalog.log
          godot --headless --path godot --editor --import --quit > /tmp/blow-strip-ci/import.log 2>&1
          BLOW_STRIP_SCIENCE_REPORT=/tmp/blow-strip-ci/science.json godot --headless --path godot --script ../tests/godot_blow_strip.gd | tee /tmp/blow-strip-ci/science.log
          for suite in domain extra fluid_density_review boundaries rolling_pendulum; do
            godot --headless --path godot --script "../tests/godot_${suite}.gd" | tee "/tmp/blow-strip-ci/${suite}.log"
          done
      - name: Actual exported Godot and browser interaction
        env:
          LAB_URL: http://127.0.0.1:8767/
          BLOW_STRIP_BROWSER_OUTPUT: /tmp/blow-strip-ci/browser
          LAB_TEST_OUTPUT: /tmp/blow-strip-ci/platform
        run: |
          set -o pipefail
          python -m http.server 8767 --directory dist > /tmp/blow-strip-ci/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$LAB_URL" -o /dev/null; then break; fi
            sleep 1
          done
          python tests/blow-strip-browser.py | tee /tmp/blow-strip-ci/browser.log
          python tests/platform_browser.py | tee /tmp/blow-strip-ci/platform.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blow-strip-regression-${{ github.sha }}
          path: /tmp/blow-strip-ci
          retention-days: 30
