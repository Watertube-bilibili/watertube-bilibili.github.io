name: Ridgebound Summit on Web, Android and Windows
on:
  push:
    branches: ['codex/ridgebound-summit-integration-20261118']
permissions:
  contents: write
concurrency:
  group: ridgebound-summit-integration-20261118
  cancel-in-progress: true
jobs:
  web:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install verified Godot 4.6.3 export tools
        run: |
          mkdir -p "$RUNNER_TEMP/ridgebound-tools"
          cd "$RUNNER_TEMP/ridgebound-tools"
          release=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          editor=Godot_v4.6.3-stable_linux.x86_64.zip
          templates=Godot_v4.6.3-stable_export_templates.tpz
          for asset in SHA512-SUMS.txt "$editor" "$templates"; do
            curl --fail --silent --show-error --location --retry 3 "$release/$asset" --output "$asset"
          done
          awk -v editor="$editor" -v templates="$templates" '$2==editor || $2==templates' SHA512-SUMS.txt | tee verified.sha512
          test "$(wc -l < verified.sha512)" -eq 2
          sha512sum --check verified.sha512
          unzip -q "$editor"
          install -m 755 Godot_v4.6.3-stable_linux.x86_64 godot
          template_dir="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$template_dir"
          unzip -p "$templates" templates/web_nothreads_release.zip > "$template_dir/web_nothreads_release.zip"
          echo "$RUNNER_TEMP/ridgebound-tools" >> "$GITHUB_PATH"
      - name: Export the Web build and run Godot regressions
        run: |
          bash sources/ridgebound/scripts/build-web.sh 2>&1 | tee "$RUNNER_TEMP/ridgebound-export.log"
          if grep -E '(^ERROR:|SCRIPT ERROR:)' "$RUNNER_TEMP/ridgebound-export.log"; then exit 1; fi
          for script in test_summit test_startup test_runtime test_mpv_physics test_streaming test_obstacle_contacts test_winch_modes test_map_import test_touch_drive; do
            timeout 180s godot --headless --path sources/ridgebound/godot --script "tests/$script.gd" 2>&1 | tee "$RUNNER_TEMP/$script.log"
            if grep -E '(SCRIPT ERROR:|^ERROR:|FAILURES [1-9])' "$RUNNER_TEMP/$script.log"; then exit 1; fi
          done
      - name: Install Chromium and Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/ridgebound-qa" playwright@1.51.1
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/ridgebound-qa/node_modules/.bin/playwright" install chromium
          fi
      - name: Drive the exported Web build in portrait and landscape
        run: |
          python3 -m http.server 9018 > "$RUNNER_TEMP/ridgebound-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:9018/ridgebound/; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/ridgebound-qa/node_modules" RIDGEBOUND_SCREENSHOTS="$RUNNER_TEMP/ridgebound-preview" node ridgebound/tests/quiet-menu.cjs http://127.0.0.1:9018/ridgebound/
          NODE_PATH="$RUNNER_TEMP/ridgebound-qa/node_modules" RIDGEBOUND_SCREENSHOTS="$RUNNER_TEMP/ridgebound-preview" node ridgebound/tests/map-upload.cjs http://127.0.0.1:9018/ridgebound/
          NODE_PATH="$RUNNER_TEMP/ridgebound-qa/node_modules" RIDGEBOUND_SCREENSHOTS="$RUNNER_TEMP/ridgebound-preview" node ridgebound/tests/device-layout.cjs http://127.0.0.1:9018/ridgebound/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ridgebound-web-preview-and-logs
          path: |
            ${{ runner.temp }}/ridgebound-preview/
            ${{ runner.temp }}/ridgebound-export.log
            ${{ runner.temp }}/test_*.log
            ridgebound/assets/vehicle-preview.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage verified build for review
        env:
          RELEASE_BASE: 'a94cf6c216c2dd553e00627497809d2f643c83dc'
        run: |
          git read-tree "$RELEASE_BASE"
          git add -- ridgebound/engine ridgebound/boot.mjs ridgebound/game.mjs ridgebound/device-layout.mjs ridgebound/index.html
          git diff --cached "$RELEASE_BASE" --check
          tree=$(git write-tree)
          commit=$(git -c user.name='Ridgebound Builder' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$RELEASE_BASE" -m 'Publish verified Ridgebound summit Web engine and immutable entry')
          git push origin "$commit:refs/heads/codex/ridgebound-summit-web-output-20261118-$GITHUB_RUN_ID"
          echo "Build commit: $commit"

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install verified Godot 4.6.3 export tools
        run: |
          mkdir -p "$RUNNER_TEMP/ridgebound-tools"
          cd "$RUNNER_TEMP/ridgebound-tools"
          release=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          editor=Godot_v4.6.3-stable_linux.x86_64.zip
          templates=Godot_v4.6.3-stable_export_templates.tpz
          for asset in SHA512-SUMS.txt "$editor" "$templates"; do
            curl --fail --silent --show-error --location --retry 3 "$release/$asset" --output "$asset"
          done
          awk -v editor="$editor" -v templates="$templates" '$2==editor || $2==templates' SHA512-SUMS.txt | tee verified.sha512
          test "$(wc -l < verified.sha512)" -eq 2
          sha512sum --check verified.sha512
          unzip -q "$editor"
          install -m 755 Godot_v4.6.3-stable_linux.x86_64 godot
          unzip -p "$templates" templates/android_release.apk > "$RUNNER_TEMP/ridgebound-tools/android_release.apk"
          echo "$RUNNER_TEMP/ridgebound-tools" >> "$GITHUB_PATH"
      - name: Use Android build tools and JDK 17
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/platform-tools/adb"
          if ! test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"; then
            sdkmanager "build-tools;36.0.0"
          fi
          echo "RIDGEBOUND_ANDROID_TEMPLATE=$RUNNER_TEMP/ridgebound-tools/android_release.apk" >> "$GITHUB_ENV"
      - name: Prepare native UI font builder
        run: python -m pip install --quiet fonttools==4.58.5
      - name: Use configured Android signing key when available
        env:
          STORE: ${{ secrets.RIDGEBOUND_ANDROID_STORE_BASE64 }}
          ALIAS_NAME: ${{ secrets.RIDGEBOUND_ANDROID_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIDGEBOUND_ANDROID_PASSWORD }}
        run: |
          if [[ -n "$STORE" ]]; then
            test -n "$ALIAS_NAME" && test -n "$KEY_PASSWORD"
            printf '%s' "$STORE" | base64 -d > "$RUNNER_TEMP/ridgebound-release.p12"
            chmod 600 "$RUNNER_TEMP/ridgebound-release.p12"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/ridgebound-release.p12" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS_NAME" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build signed ARM64 and emulator APKs
        run: |
          bash sources/ridgebound/scripts/build-android.sh "$RUNNER_TEMP/Ridgebound-Android.apk"
          RIDGEBOUND_ANDROID_ENABLE_X86_64=1 RIDGEBOUND_ANDROID_ORBIT_PROBE=1 bash sources/ridgebound/scripts/build-android.sh "$RUNNER_TEMP/Ridgebound-Android-emulator.apk"
          test "$(stat --format %s "$RUNNER_TEMP/Ridgebound-Android.apk")" -lt 95000000
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify app launches in portrait and landscape
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash sources/ridgebound/scripts/test-android.sh "$RUNNER_TEMP/Ridgebound-Android-emulator.apk" "$RUNNER_TEMP/android-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ridgebound-android-apk-and-orientation
          path: |
            ${{ runner.temp }}/Ridgebound-Android.apk
            ${{ runner.temp }}/android-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage the verified Android download
        env:
          RELEASE_BASE: 'a94cf6c216c2dd553e00627497809d2f643c83dc'
        run: |
          cp "$RUNNER_TEMP/Ridgebound-Android.apk" ridgebound/downloads/
          git read-tree "$RELEASE_BASE"
          git add -- ridgebound/downloads/Ridgebound-Android.apk
          tree=$(git write-tree)
          commit=$(git -c user.name='Ridgebound Builder' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$RELEASE_BASE" -m 'Stage the verified Ridgebound Android APK')
          git push origin "$commit:refs/heads/codex/ridgebound-summit-android-output-20261118-$GITHUB_RUN_ID"
          echo "Android build commit: $commit"

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install NSIS and the MinGW Windows compiler
        timeout-minutes: 5
        run: |
          list="$RUNNER_TEMP/ridgebound-apt.list"
          printf '%s\n' 'deb https://archive.ubuntu.com/ubuntu noble main universe' > "$list"
          apt_flags=(-o Dir::Etc::sourcelist="$list" -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_flags[@]}" update -qq
          sudo apt-get "${apt_flags[@]}" install -y --no-install-recommends nsis g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
      - name: Export Godot 4.4.1 and package Windows binaries
        run: |
          python3 -m venv "$RUNNER_TEMP/ridgefont"
          "$RUNNER_TEMP/ridgefont/bin/pip" install --quiet fonttools==4.58.5
          RIDGEBOUND_NATIVE_FONT_PYTHON="$RUNNER_TEMP/ridgefont/bin/python" bash sources/ridgebound/scripts/build-desktop.sh "$RUNNER_TEMP/ridgebound-desktop"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ridgebound-windows-downloads
          path: ${{ runner.temp }}/ridgebound-desktop/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  windows-smoke:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ridgebound-windows-downloads
          path: ${{ runner.temp }}/ridgebound-desktop
      - name: Launch portable game and test the NSIS installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Join-Path $env:RUNNER_TEMP 'ridgebound-desktop'
          $portable = Join-Path $env:RUNNER_TEMP 'Ridgebound Portable'
          $installed = Join-Path $env:RUNNER_TEMP 'Ridgebound Installed'
          function Confirm-Game($folder) {
            foreach ($name in @('Ridgebound.exe', 'Ridgebound.pck', 'ridgebound-wheel-bridge.exe')) {
              if (!(Test-Path (Join-Path $folder $name))) { throw "Package lacks $name" }
            }
            $log = Join-Path $folder 'smoke.log'
            $argline = '--headless --log-file "' + $log + '" --quit-after 300 -- --native-smoke'
            $game = Start-Process (Join-Path $folder 'Ridgebound.exe') -WorkingDirectory $folder -ArgumentList $argline -PassThru
            if (!$game.WaitForExit(60000)) { $game.Kill(); throw 'Windows game smoke timed out' }
            if (Test-Path $log) { Get-Content $log }
            if ($game.ExitCode -ne 0 -or !(Test-Path $log) -or !(Select-String -Quiet -Path $log -Pattern 'NATIVE_SMOKE_OK')) {
              throw "Windows game could not start or complete its controls smoke ($($game.ExitCode))"
            }
          }
          Expand-Archive (Join-Path $packages 'Ridgebound-Windows-x64.zip') -DestinationPath $portable
          $gameExe = @(Get-ChildItem $portable -Recurse -Filter 'Ridgebound.exe')
          if ($gameExe.Count -ne 1) { throw 'Portable archive must include one Ridgebound.exe' }
          Confirm-Game $gameExe[0].Directory.FullName
          $setup = Start-Process (Join-Path $packages 'Ridgebound-Setup-x64.exe') -ArgumentList "/S /D=$installed" -PassThru -Wait
          if ($setup.ExitCode -ne 0 -or !(Test-Path (Join-Path $installed 'Uninstall.exe'))) { throw 'Installation failed' }
          Confirm-Game $installed
          $uninstaller = Start-Process (Join-Path $installed 'Uninstall.exe') -ArgumentList '/S' -PassThru -Wait
          if ($uninstaller.ExitCode -ne 0 -or (Test-Path (Join-Path $installed 'Ridgebound.exe'))) { throw 'Uninstall failed' }
      - name: Stage the verified Windows downloads
        shell: bash
        env:
          RELEASE_BASE: 'a94cf6c216c2dd553e00627497809d2f643c83dc'
        run: |
          cp "$RUNNER_TEMP/ridgebound-desktop/Ridgebound-Setup-x64.exe" ridgebound/downloads/
          cp "$RUNNER_TEMP/ridgebound-desktop/Ridgebound-Windows-x64.zip" ridgebound/downloads/
          git read-tree "$RELEASE_BASE"
          git add -- ridgebound/downloads/Ridgebound-Setup-x64.exe ridgebound/downloads/Ridgebound-Windows-x64.zip
          git diff --cached "$RELEASE_BASE" --check
          tree=$(git write-tree)
          commit=$(git -c user.name='Ridgebound Builder' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$RELEASE_BASE" -m 'Add the verified Ridgebound Windows installer and portable build')
          git push origin "$commit:refs/heads/codex/ridgebound-summit-windows-output-20261118-$GITHUB_RUN_ID"
          echo "Desktop build commit: $commit"
