name: Build and verify Ridgebound Android
on:
  push:
    branches: ['codex/ridgebound-expedition-android-20261118']
permissions:
  contents: write
concurrency:
  group: ridgebound-expedition-android-20261118
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install verified Blender Python runtime
        timeout-minutes: 6
        run: |
          mkdir -p "$RUNNER_TEMP/ridgebound-blender"
          cd "$RUNNER_TEMP/ridgebound-blender"
          python -m pip download --quiet --only-binary=:all: --no-deps 'bpy==4.3.0'
          echo '1620199392a7e7aab58672aa47c50b3c5b1e4d39d46af5a7f9bbe2af561ea942  bpy-4.3.0-cp311-cp311-manylinux_2_28_x86_64.whl' | sha256sum --check
          python -m pip install --quiet 'numpy==1.26.4' ./bpy-4.3.0-cp311-cp311-manylinux_2_28_x86_64.whl
          python -c 'import bpy, bmesh; print(bpy.app.version_string)'
      - name: Build editable model, game GLB
        run: |
          python3 -m py_compile sources/ridgebound/build_vehicle.py sources/ridgebound/cabin.py
          python sources/ridgebound/build_vehicle.py
          test -s ridgebound/assets/ridge-rover.glb
          test -s sources/ridgebound/ridge-rover.blend
      - name: Install verified Godot 4.6.3 export tools
        run: |
          mkdir -p "$RUNNER_TEMP/ridgebound-tools"
          cd "$RUNNER_TEMP/ridgebound-tools"
          release=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          editor=Godot_v4.6.3-stable_linux.x86_64.zip
          templates=Godot_v4.6.3-stable_export_templates.tpz
          for asset in SHA512-SUMS.txt "$editor" "$templates"; do
            curl --fail --silent --show-error --location --retry 3 "$release/$asset" --output "$asset"
          done
          awk -v editor="$editor" -v templates="$templates" '$2==editor || $2==templates' SHA512-SUMS.txt | tee verified.sha512
          test "$(wc -l < verified.sha512)" -eq 2
          sha512sum --check verified.sha512
          unzip -q "$editor"
          install -m 755 Godot_v4.6.3-stable_linux.x86_64 godot
          unzip -p "$templates" templates/android_release.apk > "$RUNNER_TEMP/ridgebound-tools/android_release.apk"
          echo "$RUNNER_TEMP/ridgebound-tools" >> "$GITHUB_PATH"
      - name: Use Android build tools and JDK 17
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/platform-tools/adb"
          if ! test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"; then
            sdkmanager "build-tools;36.0.0"
          fi
          echo "RIDGEBOUND_ANDROID_TEMPLATE=$RUNNER_TEMP/ridgebound-tools/android_release.apk" >> "$GITHUB_ENV"
      - name: Build signed ARM64 and emulator APKs
        run: |
          bash sources/ridgebound/scripts/build-android.sh "$RUNNER_TEMP/Ridgebound-Android.apk"
          RIDGEBOUND_ANDROID_ENABLE_X86_64=1 bash sources/ridgebound/scripts/build-android.sh "$RUNNER_TEMP/Ridgebound-Android-emulator.apk"
          test "$(stat --format %s "$RUNNER_TEMP/Ridgebound-Android.apk")" -lt 95000000
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify app launches in portrait and landscape
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash sources/ridgebound/scripts/test-android.sh "$RUNNER_TEMP/Ridgebound-Android-emulator.apk" "$RUNNER_TEMP/android-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ridgebound-android-apk-and-orientation
          path: |
            ${{ runner.temp }}/Ridgebound-Android.apk
            ${{ runner.temp }}/android-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage the verified Android download
        env:
          RELEASE_BASE: '527dacc1d0dbcd47f75da82bd77affbf26b1217b'
        run: |
          cp "$RUNNER_TEMP/Ridgebound-Android.apk" ridgebound/downloads/
          git read-tree "$RELEASE_BASE"
          git add -- ridgebound/downloads/Ridgebound-Android.apk
          tree=$(git write-tree)
          commit=$(git -c user.name='Ridgebound Builder' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$RELEASE_BASE" -m 'Stage the verified Ridgebound Android APK')
          git push origin "$commit:refs/heads/codex/ridgebound-expedition-android-output-20261118"
          echo "Android build commit: $commit"
