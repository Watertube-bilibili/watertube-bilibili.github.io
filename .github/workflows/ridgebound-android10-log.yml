name: Read Android 10 startup evidence
on:
  push:
    branches: ['codex/ridgebound-android10-trail-20261118']
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read the previous APK startup log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44280852410 -R "${{ github.repository }}" -n ridgebound-android-apk-and-orientation --dir "$RUNNER_TEMP/android-startup-log"
          find "$RUNNER_TEMP/android-startup-log" -type f -name android.log -exec cat {} \;
