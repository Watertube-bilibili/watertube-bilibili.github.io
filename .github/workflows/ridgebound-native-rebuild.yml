name: Check rebuilt Ridgebound controls and safe layout
on:
  push:
    branches: ['codex/ridgebound-rebuilt-native-20261118']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install and verify Godot 4.4.1
        run: |
          mkdir -p "$RUNNER_TEMP/godot44"
          cd "$RUNNER_TEMP/godot44"
          release=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          editor=Godot_v4.4.1-stable_linux.x86_64.zip
          for asset in SHA512-SUMS.txt "$editor"; do
            curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 "$release/$asset" --output "$asset"
          done
          awk -v file="$editor" '$2==file || $2==("*" file)' SHA512-SUMS.txt | sha512sum --check
          unzip -q "$editor"
          install -m 755 "${editor%.zip}" godot
          echo "$RUNNER_TEMP/godot44" >> "$GITHUB_PATH"
      - name: Assemble the native CJK font
        run: |
          python3 -m venv "$RUNNER_TEMP/ridgebound-font-tools"
          "$RUNNER_TEMP/ridgebound-font-tools/bin/python" -m pip install --disable-pip-version-check --quiet 'fonttools==4.58.5'
          "$RUNNER_TEMP/ridgebound-font-tools/bin/python" sources/ridgebound/scripts/build-native-font.py sources/ridgebound/godot
      - name: Import textures using OpenGL and check the native scene
        run: |
          project=sources/ridgebound/godot
          sed -i 's#run/main_scene="res://main.tscn"#run/main_scene="res://desktop_main.tscn"#; s#PackedStringArray("4.6"#PackedStringArray("4.4"#' "$project/project.godot"
          timeout 90s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --editor --path "$project" --import --quit 2>&1 | tee "$RUNNER_TEMP/import-native.log"
          python3 - "$RUNNER_TEMP/import-native.log" <<'PY'
          import pathlib
          import re
          import sys
          text = pathlib.Path(sys.argv[1]).read_text()
          if ' - Compatibility - ' not in text:
              raise SystemExit('OpenGL compatibility was not selected')
          text = re.sub(
              r'^ERROR: Required extension VK_KHR_surface not found\.\n'
              r'[^\n]*drivers/vulkan/rendering_context_driver_vulkan\.cpp[^\n]*\n'
              r'^ERROR: Condition "err != OK" is true\. Returning: err\n'
              r'[^\n]*drivers/vulkan/rendering_context_driver_vulkan\.cpp[^\n]*\n',
              '', text, flags=re.MULTILINE,
          )
          if re.search(r'(^|\s)(SCRIPT ERROR|ERROR):', text):
              raise SystemExit('Unexpected Godot import error')
          PY
      - name: Start the cockpit interface and verify pause, view and import controls
        run: |
          timeout 60s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --path sources/ridgebound/godot --quit-after 300 -- --native-smoke 2>&1 | tee "$RUNNER_TEMP/smoke-native.log"
          if grep -E '(^ERROR:|SCRIPT ERROR:)' "$RUNNER_TEMP/smoke-native.log"; then exit 1; fi
          grep -q NATIVE_SMOKE_OK "$RUNNER_TEMP/smoke-native.log"
      - name: Exercise independent camera touch ownership and the screen catalogue
        run: |
          timeout 45s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --path sources/ridgebound/godot --script res://tests/native_rebuild_smoke.gd 2>&1 | tee "$RUNNER_TEMP/rebuild-native.log"
          if grep -E '(^ERROR:|SCRIPT ERROR:)' "$RUNNER_TEMP/rebuild-native.log"; then exit 1; fi
          grep -q NEW_NATIVE_SMOKE_OK "$RUNNER_TEMP/rebuild-native.log"
