name: Confirm Ridgebound runs on Android 10
on:
  push:
    branches: ['codex/ridgebound-android10-trail-20261118']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 29, gpu: swangle, profile: pixel_3a, target: default}
          - {api: 35, gpu: swiftshader_indirect, profile: pixel_7, target: google_apis}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install verified Godot 4.6.3 export tools
        run: |
          mkdir -p "$RUNNER_TEMP/ridgebound-tools"
          cd "$RUNNER_TEMP/ridgebound-tools"
          release=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          editor=Godot_v4.6.3-stable_linux.x86_64.zip
          templates=Godot_v4.6.3-stable_export_templates.tpz
          for asset in SHA512-SUMS.txt "$editor" "$templates"; do
            curl --fail --silent --show-error --location --retry 3 "$release/$asset" --output "$asset"
          done
          awk -v editor="$editor" -v templates="$templates" '$2==editor || $2==templates' SHA512-SUMS.txt | tee verified.sha512
          test "$(wc -l < verified.sha512)" -eq 2
          sha512sum --check verified.sha512
          unzip -q "$editor"
          install -m 755 Godot_v4.6.3-stable_linux.x86_64 godot
          unzip -p "$templates" templates/android_release.apk > "$RUNNER_TEMP/ridgebound-tools/android_release.apk"
          echo "$RUNNER_TEMP/ridgebound-tools" >> "$GITHUB_PATH"
      - name: Use Android build tools and JDK 17
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/platform-tools/adb"
          if ! test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"; then
            sdkmanager "build-tools;36.0.0"
          fi
          echo "RIDGEBOUND_ANDROID_TEMPLATE=$RUNNER_TEMP/ridgebound-tools/android_release.apk" >> "$GITHUB_ENV"
      - name: Prepare native UI font builder
        run: python -m pip install --quiet fonttools==4.58.5
      - name: Use configured Android signing key when available
        env:
          STORE: ${{ secrets.RIDGEBOUND_ANDROID_STORE_BASE64 }}
          ALIAS_NAME: ${{ secrets.RIDGEBOUND_ANDROID_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIDGEBOUND_ANDROID_PASSWORD }}
        run: |
          if [[ -n "$STORE" ]]; then
            test -n "$ALIAS_NAME" && test -n "$KEY_PASSWORD"
            printf '%s' "$STORE" | base64 -d > "$RUNNER_TEMP/ridgebound-release.p12"
            chmod 600 "$RUNNER_TEMP/ridgebound-release.p12"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/ridgebound-release.p12" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS_NAME" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build signed ARM64 and emulator APKs
        run: |
          RIDGEBOUND_ANDROID_ENABLE_X86_64=1 RIDGEBOUND_ANDROID_ORBIT_PROBE=1 bash sources/ridgebound/scripts/build-android.sh "$RUNNER_TEMP/Ridgebound-Android-emulator.apk"
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify app launches in portrait and landscape
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -cores 3 -noaudio -no-boot-anim -no-snapshot
          script: bash sources/ridgebound/scripts/test-android.sh "$RUNNER_TEMP/Ridgebound-Android-emulator.apk" "$RUNNER_TEMP/android-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ridgebound-android-api-${{ matrix.api }}-orientation
          path: |
            ${{ runner.temp }}/android-smoke/
          if-no-files-found: ignore
          retention-days: 7
