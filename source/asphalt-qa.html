<!doctype html><meta charset="utf-8"><title>SUNRISE COAST — actual runtime asphalt QA</title>
<style>html,body{margin:0;height:100%;background:#162128;color:#fff;font:13px system-ui}header{height:73px;padding:7px 14px;box-sizing:border-box}button{margin:5px 5px 0 0;padding:5px 10px}iframe{display:block;width:100%;height:calc(100% - 73px);border:0}#status{float:right}</style>
<header><b id="label">ACTUAL GAME RUNTIME / not a concept image</b><span id="status">Loading Game + Godot</span><br><button id="wide">1 Same-pose road view</button><button id="near">2 Near road + marking</button><button id="junction">3 Junction</button><button id="drive">4 Native drive (90 ticks)</button><button id="record">Record evidence</button><button id="clean">Hide game HUD</button></header><iframe id="game"></iframe>
<script type="module">
const params=new URLSearchParams(location.search),old=params.get('asphalt')==='procedural';
const frame=document.querySelector('iframe'),status=document.querySelector('#status');
frame.src='./runtime-candidate/sunset-coast/play/index.html?preview=1&map=estuary&blenderVehicle=volt-s-v2&damage=structure&structuralDiagnostics=1&pbr=1'+(old?'&asphalt=procedural':'');
document.querySelector('#label').textContent=(old?'BEFORE · procedural 256 PNG':'AFTER · photographic Asphalt 01 / 512')+' · ACTUAL GAME + GODOT / not a concept image';
let g,view='wide',pose=null,history=[],drive=null;
const cameras={wide:{pos:[1213,7.8,236],aim:[1195,4.2,215]},near:{pos:[1204.2,5.1,225],aim:[1200,4.16,214]},junction:{pos:[1217,6.2,645],aim:[1205,4.16,611]}};
function camera(name){view=name;pose=cameras[name];g.paused=true;g.resetControls();g.inCar=false;g.playerPos.set(1200,4.3,name==='junction'?620:211);g.person.root.visible=false;g.world.update(g.playerPos,true);g.clockMinutes=13*60;g.weather='clear';g.updateLighting();g.camera.position.set(...pose.pos);g.camera.lookAt(...pose.aim);g.camera.fov=58;g.camera.updateProjectionMatrix();g.renderer.render(g.scene,g.camera);}
function report(){if(!g)return;const list=[];g.scene.traverse(o=>{for(const m of Array.isArray(o.material)?new Set(o.material):[o.material])if(m?.userData?.sunriseAsphaltPBR)list.push({mesh:o.name,kind:o.type,topOnly:o.userData.asphaltTopOnly??false,material:m.name,colorSpace:m.map.colorSpace,armColorSpace:m.roughnessMap.colorSpace,size:[m.map.image.width,m.map.image.height],normal:m.normalMap!==null,bump:m.bumpMap!==null,metalness:m.metalness,roughness:m.roughness,anisotropy:m.map.anisotropy,projection:m.userData.sunriseAsphaltPBR});});const gl=g.renderer.getContext(),debug=gl.getExtension('WEBGL_debug_renderer_info');return{label:(old?'before':'after')+'-'+view,actualGodot:g.physics.ready&&g.physics.backend.includes('Godot'),backend:g.physics.backend,nativeTick:g.physics.lastTick,frameCount:g.frameCount,view,pose,paused:g.paused,vehicle:{id:g.vehicle.model.id,pos:g.vehicle.pos.toArray(),speed:g.vehicle.speed,condition:g.vehicle.condition},photos:list,history,renderer:debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),gpuPrograms:g.renderer.info.programs?.map(p=>({name:p.name,runnable:p.diagnostics?.runnable??null})),storageKeys:Object.keys(frame.contentWindow.localStorage),gameSaveAttempt:g.save(false),preview:true};}
async function record(){const data=report();if(data)await fetch('/asphalt-qa-evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});status.textContent='Recorded '+data?.label+' / native tick '+g.physics.lastTick;}
for(const name of Object.keys(cameras))document.getElementById(name).onclick=()=>{if(g){camera(name);record();}};
document.querySelector('#record').onclick=record;
document.querySelector('#clean').onclick=()=>{const d=frame.contentDocument;const style=d.createElement('style');style.textContent='body>*:not(canvas):not(script):not(style){display:none!important} canvas:not(#world){display:none!important}';d.head.append(style);};
document.querySelector('#drive').onclick=()=>{if(!g?.physics?.ready)return;g.ui.closeModal?.();g.ui.closePhone?.();g.inCar=true;g.person.root.visible=false;g.transition=null;g.autopilot=false;g.vehicle.parkingBrakeEngaged=false;g.vehicle.touchDriveGear='D';g.selectedTouchGear='D';g.resetControls();g.physics.queueCommand({id:g.vehicle.physicsId,type:'teleport',pos:[1206,5.1,215],quat:[0,0,0,1],linear:[0,0,0],angular:[0,0,0]});history=[];drive={start:g.physics.lastTick};pose=null;g.paused=false;view='native-drive';};
const init=setInterval(()=>{g=frame.contentWindow.game;if(!g?.physics?.ready)return;clearInterval(init);g.renderer.setPixelRatio(1);g.renderer.setSize(frame.clientWidth,frame.clientHeight);g.sensorInterval=60;const cameraOriginal=g.updateCamera.bind(g);g.updateCamera=(...a)=>{if(pose){g.camera.position.set(...pose.pos);g.camera.lookAt(...pose.aim);g.camera.fov=58;g.camera.updateProjectionMatrix();}else cameraOriginal(...a);};const tick=g.physics.tick.bind(g.physics);g.physics.tick=s=>{const r=tick(s);if(drive){const c=r.controls.find(x=>x.id===g.vehicle.physicsId);if(c)Object.assign(c,{throttle:.6,manualBrake:0,electronicBrake:0,steer:0,handbrake:false});if(s.tick%10===0)history.push(s.bodies.find(b=>b.id===g.vehicle.physicsId));if(s.tick-drive.start>=90){g.paused=true;r.paused=true;drive=null;record();}}return r;};status.textContent='Godot connected · isolation preview=1';camera('wide');record();},300);
</script>
