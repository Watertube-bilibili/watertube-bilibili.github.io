<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>个人主页 · 响应式检查</title><style>*{box-sizing:border-box}body{margin:0;background:#e7dfd0;color:#142b38;font:14px/1.5 system-ui}header{padding:16px 20px;border-bottom:1px solid #807e74;background:#f5f0e6}h1{font-size:18px;margin:0 0 6px}p{margin:6px 0}nav{display:flex;gap:6px;flex-wrap:wrap}button,select{font:inherit;min-height:44px;padding:9px 13px;border:1px solid #78909a;background:#142b38;color:#f5f0e6;border-radius:3px}button[aria-pressed=true]{background:#a43c28}button:focus-visible,select:focus-visible{outline:3px solid #a43c28;outline-offset:3px}main{padding:16px;overflow:auto}iframe{display:block;margin:0 auto;border:0;background:#f5f0e6;width:390px;height:844px}pre{padding:16px;white-space:pre-wrap;font-size:12px}#status{color:#a43c28}</style><header><h1>个人主页 / 响应式检查</h1><p>QA 页面，iframe 直接载入真实首页与项目页；不使用示意布局。</p><nav aria-label="测试控制"><select id="page" aria-label="测试页面"><option value="home">首页</option><option value="projects">项目</option></select><button data-size="320,568">320 × 568</button><button data-size="390,844" aria-pressed="true">390 × 844</button><button data-size="844,390">844 × 390</button><button data-size="1440,900">1440 × 900</button><button id="check">检查当前页面</button><button id="matrix">运行全部 8 项检查</button></nav><p id="status" role="status">载入中…</p></header><main><iframe id="preview" title="真实个人主页响应式预览"></iframe></main><pre id="report"></pre><script>
const frame=document.querySelector('iframe'),selector=document.querySelector('#page'),status=document.querySelector('#status'),report=document.querySelector('#report');const pages={home:'../index.html?v=d565d086da2b',projects:'../projects.html?v=8db76580795d'};let size=[390,844],busy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function setSize(values){size=values;frame.style.width=size[0]+'px';frame.style.height=size[1]+'px';document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.size===size.join(','))))}
async function load(page){selector.value=page;await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject;frame.src=pages[page]});await frame.contentDocument.fonts.ready;await wait(120)}
function sample(){const doc=frame.contentDocument,rect=n=>{const r=n.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),height:Math.round(r.height)}};const links=[...doc.querySelectorAll('a')];const actions=[...doc.querySelectorAll('.action')];const overflow=doc.documentElement.scrollWidth>frame.clientWidth+1;const bounds=actions.every(a=>{const r=a.getBoundingClientRect();return r.left>=0&&r.right<=frame.clientWidth+1&&a.scrollWidth<=a.clientWidth+1});const targets=links.every(a=>a.getBoundingClientRect().height>=44);return{page:selector.value,viewport:size.join('×'),passed:!overflow&&bounds&&targets,horizontalOverflow:overflow,actionBounds:bounds,targets44:targets,homepageExactlyTwoLinks:selector.value==='home'?links.length===2:null,heading:rect(doc.querySelector('h1')),actions:actions.map(a=>({text:a.textContent.trim(),href:a.getAttribute('href'),...rect(a)})),documentHeight:doc.documentElement.scrollHeight}}
function show(r){report.textContent=JSON.stringify(r,null,2);status.textContent=r.passed?'PASS · 无横向溢出，入口在边界内，点击目标 ≥44px':'FAIL · 请检查下方结果'}
selector.onchange=async()=>{if(!busy){await load(selector.value);show(sample())}};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=async()=>{if(!busy){setSize(b.dataset.size.split(',').map(Number));await wait(120);show(sample())}});document.querySelector('#check').onclick=()=>show(sample());document.querySelector('#matrix').onclick=async()=>{if(busy)return;busy=true;status.textContent='正在检查两页、四个视口…';const rows=[];try{for(const page of ['home','projects'])for(const viewport of [[320,568],[390,844],[844,390],[1440,900]]){setSize(viewport);await load(page);rows.push(sample())}const passed=rows.every(r=>r.passed&&r.homepageExactlyTwoLinks!==false);report.textContent=JSON.stringify({passed,rows},null,2);status.textContent=passed?'PASS · 8 项真实页面布局检查通过':'FAIL · 见下方报告'}catch(e){status.textContent='检查失败：'+e.message}finally{busy=false}};load('home').then(()=>show(sample())).catch(e=>status.textContent=e.message);
</script></html>
