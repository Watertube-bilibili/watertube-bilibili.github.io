/* Static, stud-exact Art Deco masonry. All allocation happens at startup. */
function makeBlueprint() {
  const out = [];
  const dimensions = [[2,4,1.2],[2,2,1.2],[1,4,1.2],[1,2,1.2],[1,1,1.2],[2,4,.4],[2,2,.4]];
  let y = 0, floor = 0;
  function brick(shape, gx, gz, rot, color, clear, quarterTurn = 0, spire = false) {
    let w = dimensions[shape][rot & 1 ? 1 : 0];
    let d = dimensions[shape][rot & 1 ? 0 : 1];
    if (quarterTurn) { const oldX = gx; gx = -gz-d; gz = oldX; rot = (rot+1)&3; }
    out.push({shape, color, clear, gx, gz, rot, y:Math.round(y*10)/10, floor, spire});
  }
  // 8 x 8, two-stud thick ring. The 4 x 4 courtyard remains hollow.
  for (let level=0; level<6; ++level) {
    const c = level < 3 ? 0 : 1, q=level&1;
    brick(0,-4,-4,1,c,true,q); brick(0,0,-4,1,c,true,q);
    brick(0,-4,2,1,c,true,q); brick(0,0,2,1,c,true,q);
    brick(0,-4,-2,0,c,false,q); brick(0,2,-2,0,c,false,q);
    y+=1.2; ++floor;
  }
  // Every slab piece spans an exterior wall: no floating courtyard infill.
  for(let x=-4;x<4;x+=2) { brick(5,x,-4,0,1,true); brick(5,x,0,0,1,true); }
  y+=.4; ++floor;
  // 6 x 6, one-stud thick shaft. Alternate orientation AND seam location.
  for(let level=0;level<10;++level) {
    const c=level<3?2:level<7?3:4, q=level&1;
    brick(2,-3,-3,1,c,true,q); brick(3,1,-3,1,c,true,q);
    brick(3,-3,2,1,c,true,q); brick(2,-1,2,1,c,true,q);
    brick(2,-3,-2,0,c,false,q); brick(2,2,-2,0,c,false,q);
    y+=1.2; ++floor;
  }
  // 6 x 6 slab: three spanning rows and a side strip. Every plate has
  // studs directly below it, including the central spanning row.
  brick(5,-3,-3,0,4,true); brick(6,-3,1,0,4,true);
  brick(5,-1,-3,1,4,true); brick(5,-1,-1,1,4,true); brick(5,-1,1,1,4,true);
  y+=.4; ++floor;
  // 4 x 4 upper ring: six 1 x 2 pieces, alternating seam direction.
  for(let level=0;level<8;++level) {
    const c=level<3?4:5, q=level&1;
    brick(3,-2,-2,0,c,true,q); brick(3,-2,0,0,c,true,q);
    brick(3,1,-2,0,c,true,q); brick(3,1,0,0,c,true,q);
    brick(3,-1,-2,1,c,false,q); brick(3,-1,1,1,c,false,q);
    y+=1.2; ++floor;
  }
  brick(5,-2,-2,0,5,true); brick(5,0,-2,0,5,true);
  y+=.4; ++floor;
  for(let level=0;level<4;++level) { brick(1,-1,-1,level&1,5,false); y+=1.2; ++floor; }
  // Integer stud grid intentionally offsets the single-stud spire half a stud.
  // It is physically connected to one of the crown's four studs.
  for(let level=0;level<4;++level) { brick(4,-1,-1,0,5,level===3,0,true); y+=1.2; ++floor; }
  return out;
}
