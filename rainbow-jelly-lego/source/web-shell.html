<script>
'use strict';
const DEMO=window.toyDemo,params=new URLSearchParams(location.search),canvas=document.getElementById('canvas'),stage=document.getElementById('stage');
window.toyCommands=[];let isReady=false,isMuted=false,isPaused=false,isCinema=false,activeTool=0,shape=0,nextColor=0,uses=0,pourHeld=false,toastTimer=0;

const colors=['#db3953','#e87c35','#e0bc32','#6d9d57','#5689bb','#9b6aa9'],shapeNames=['2 × 4','2 × 2','1 × 4','1 × 2','1 × 1','2 × 4 薄板','2 × 2 薄板'];

function toast(text){if(DEMO||!text)return;const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500);}
function updateQueue(){document.getElementById('queue').innerHTML=[0,1,2].map(n=>'<span class="queue-brick"><i class="queue-swatch" style="background:'+colors[(nextColor+n)%6]+'"></i>'+shapeNames[shape].replace(' 薄板','')+'</span>').join('');document.getElementById('shape-name').textContent=shapeNames[shape];}
function selected(elements,test){for(const el of elements){const on=test(el);el.classList.toggle('active',on);el.setAttribute('aria-pressed',String(on));}}
function audioGesture(){if(!DEMO)AudioToy.ensure();}
window.toyCommand=function(cmd,value){if(DEMO)return;if(cmd==='mute'){isMuted=!isMuted;AudioToy.muted=isMuted;document.getElementById('mute-btn').textContent=isMuted?'♪':'♫';document.getElementById('mute-btn').setAttribute('aria-label',isMuted?'开启声音':'静音');document.getElementById('mute-btn').setAttribute('aria-pressed',String(isMuted));}
if(cmd==='pause'){isPaused=!isPaused;document.getElementById('pause-btn').textContent=isPaused?'▶':'Ⅱ';document.getElementById('pause-btn').setAttribute('aria-label',isPaused?'继续':'暂停');}
if(cmd==='cinema'){isCinema=!isCinema;document.documentElement.classList.toggle('cinema',isCinema);resizeCanvas();if(isCinema)toast('影院模式 · 按 C 返回');}

if(cmd==='shape'){shape=Number(value);selected(document.querySelectorAll('[data-shape]'),el=>Number(el.dataset.shape)===shape);updateQueue();}
if(cmd==='palette')selected(document.querySelectorAll('[data-palette]'),el=>el.dataset.palette===value);
if(cmd==='reset')nextColor=0;
if(isReady)window.toyCommands.push({cmd,value:value===undefined?null:value});
};

const AudioToy={context:null,master:null,voices:0,last:Object.create(null),muted:false,noise:null,ensure(){if(DEMO)return;try{if(!this.context){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.context=new AC();this.master=this.context.createGain();this.master.gain.value=.30;const compressor=this.context.createDynamicsCompressor();compressor.threshold.value=-16;compressor.knee.value=12;compressor.ratio.value=5;this.master.connect(compressor);compressor.connect(this.context.destination);this.noise=this.context.createBuffer(1,this.context.sampleRate*.35,this.context.sampleRate);const d=this.noise.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){last=(last+(Math.random()*2-1)*.08)/1.02;d[i]=last*3;}}if(this.context.state==='suspended')this.context.resume().catch(()=>{});}catch(_){}} ,play(type,pitch=1){if(DEMO||this.muted||!this.context||this.context.state!=='running')return;const now=this.context.currentTime,minGap={snap:.045,clack:.06,impact:.06,pour:.14,wub:.3,quake:.4}[type]||.08;if(now-(this.last[type]??-100)<minGap||this.voices>=10)return;this.last[type]=now;

<script>
// GitHub Pages can serve .wasm without transport compression. Decode only this
// engine's gzip asset; every other request keeps the browser's original fetch.
(()=>{if(typeof DecompressionStream!=='function')return;

  let url;try{url=new URL(typeof input==='string'||input instanceof URL?input:input.url,document.baseURI);}catch(_){return originalFetch(input,init);}
  const method=(init&&init.method)||(input instanceof Request&&input.method)||'GET';
  if(method!=='GET'||url.origin!==wasmURL.origin||url.pathname!==wasmURL.pathname)return originalFetch(input,init);
  const compressedURL=new URL(url);compressedURL.pathname+='.gz';
  try{
   const response=await originalFetch(compressedURL.href,init);
   if(!response.ok||!response.body)return originalFetch(input,init);
   const body=/\bgzip\b/i.test(response.headers.get('Content-Encoding')||'')?response.body:response.body.pipeThrough(new DecompressionStream('gzip'));

 };
